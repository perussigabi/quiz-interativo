
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz">

        <h1>Quiz de Desenvolvimento</h1>
        <p class="descricao">Teste seus conhecimentos!</p>

        <div id="progresso"></div>

        <div id="areaPergunta">
            <h2 id="pergunta"></h2>

            <div id="alternativas"></div>

            <p id="resultado"></p>

            <button id="btnProxima" onclick="proximaPergunta()" disabled>
                Próxima pergunta
            </button>
        </div>

        <div id="telaFinal" style="display: none;">
            <h2>Quiz finalizado!</h2>
            <p id="pontuacaoFinal"></p>
            <p id="mensagemFinal"></p>

            <button onclick="reiniciarQuiz()">
                Reiniciar quiz
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
